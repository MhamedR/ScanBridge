<mat-card class="qr-card h-full flex flex-col">
  <mat-card-header class="flex items-center mb-4">
    <mat-icon class="mr-2 text-blue-600">qr_code_scanner</mat-icon>
    <mat-card-title class="text-xl font-semibold">Pair Your Device</mat-card-title>
  </mat-card-header>

  <mat-card-content class="flex-1 flex flex-col items-center justify-center">
    @if (loading()) {
      <div class="flex flex-col items-center">
        <mat-spinner diameter="50"></mat-spinner>
        <p class="mt-4 text-gray-600">Generating QR code...</p>
      </div>
    } @else if (error()) {
      <div class="text-center text-red-600">
        <mat-icon class="text-4xl mb-2">error</mat-icon>
        <p>{{ error() }}</p>
        <button mat-raised-button color="primary" (click)="refreshQRCode()" class="mt-4">
          <mat-icon>refresh</mat-icon>
          Retry
        </button>
      </div>
    } @else if (qrCodeDataUrl() && !loading() && !error()) {
      <div class="flex flex-col items-center">
        <img [src]="qrCodeDataUrl()" alt="QR Code" class="qr-image mb-4 rounded-lg shadow-lg" />
        <p class="text-sm text-gray-600 text-center max-w-xs">
          Scan this QR code with your phone to connect
        </p>
        <button
          mat-icon-button
          (click)="refreshQRCode()"
          class="mt-2"
          matTooltip="Refresh QR Code"
        >
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    }
  </mat-card-content>
</mat-card>
